<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Codex Immortalis – Offline</title>
  <style>
    *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }
    html, body {
      height: 100%; width: 100%;
      background: #050307;
      color: #e8d5b0;
      font-family: 'EB Garamond', Georgia, serif;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
    }
    .container {
      text-align: center;
      padding: 32px 24px;
      max-width: 340px;
    }
    .icon { font-size: 4rem; margin-bottom: 16px; opacity: 0.7; }
    h1 {
      font-family: Georgia, serif;
      font-size: 22px;
      color: #c9a84c;
      letter-spacing: 3px;
      margin-bottom: 12px;
    }
    p {
      font-size: 14px;
      color: #8a6520;
      line-height: 1.6;
      margin-bottom: 24px;
      font-style: italic;
    }
    .divider {
      width: 60%;
      height: 1px;
      background: linear-gradient(90deg, transparent, #8a6520, transparent);
      margin: 0 auto 24px;
    }
    .retry-btn {
      background: linear-gradient(135deg, #1a1205, #2d1f05);
      border: 1px solid #c9a84c;
      border-radius: 6px;
      padding: 12px 28px;
      font-family: Georgia, serif;
      font-size: 12px;
      color: #f0d080;
      letter-spacing: 2px;
      cursor: pointer;
      text-transform: uppercase;
      transition: box-shadow 0.2s;
    }
    .retry-btn:hover {
      box-shadow: 0 0 16px rgba(201,168,76,0.4);
    }
    .note {
      margin-top: 20px;
      font-size: 11px;
      color: #3a2030;
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="icon">⚔️</div>
    <h1>CODEX IMMORTALIS</h1>
    <div class="divider"></div>
    <p>
      Du bist momentan offline.<br>
      Sobald deine Verbindung wiederhergestellt ist,<br>
      kehrt das Codex zu dir zurück.
    </p>
    <button class="retry-btn" onclick="window.location.reload()">
      Erneut versuchen
    </button>
    <p class="note">
      Bereits geladene Inhalte sind weiterhin verfügbar.
    </p>
  </div>
</body>
</html>
